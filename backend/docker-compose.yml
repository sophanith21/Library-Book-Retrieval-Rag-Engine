services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '9333:9333'
      - '8333:8333'
    volumes:
      - seaweeddata:/data
      - ../infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json

  book:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx nest start book --watch
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: devaccess
      S3_SECRET_KEY: devsecret
      S3_BUCKET: books
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx nest start auth --watch
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy


  indexing:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx nest start indexing --watch
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  retrieval:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx nest start retrieval --watch
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx nest start api-gateway --watch
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
  backend_node_modules:
