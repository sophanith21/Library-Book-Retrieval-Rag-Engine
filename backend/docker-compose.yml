services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '9333:9333'
      - '8333:8333'
    volumes:
      - seaweeddata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c 'npx prisma migrate deploy && npx prisma generate'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  book:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx nest start book --watch
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npx nest start api-gateway --watch
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
