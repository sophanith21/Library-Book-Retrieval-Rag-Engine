services:
  # Edge Gateway: Unified reverse proxy for Client Browser
  # Routes:
  #   - Static / UI Route (/) -> UI Server (frontend)
  #   - API Route (/api/)     -> API Gateway
  #   - Monitoring (/monitoring/) -> Grafana (otel-lgtm)
  edge-gateway:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./infra/edge-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api-gateway
      - otel-lgtm

  # UI Server (Frontend React SPA)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    environment:
      - VITE_API_BASE_URL=/api

  # API Gateway: HTTP Entrypoint for Backend Microservices
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npx nest start api-gateway --watch
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Authentication Microservice (admin/student)
  auth:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npx nest start auth --watch
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/app
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Book Microservice (Reading, adding books, SeaweedFS storage)
  book:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npx nest start book --watch
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/app
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_PUBLIC_ENDPOINT=http://localhost:8333
      - S3_ACCESS_KEY=devaccess
      - S3_SECRET_KEY=devsecret
      - S3_BUCKET=books
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Indexing Microservice (Sparse BM25 + Dense PgVector indexing)
  indexing:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npx nest start indexing --watch
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/app
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Retrieval Microservice (Sparse BM25 + Dense Vector + RRF fusion)
  retrieval:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npx nest start retrieval --watch
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/app
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # LLM Microservice (RAG synthesis with top 5 fused chunks)
  llm:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: npx nest start llm --watch
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy

  # RabbitMQ Event Bus / Microservice Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # PostgreSQL DB with PgVector extension
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # SeaweedFS S3-compatible Object Storage for Books
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '9333:9333'
      - '8333:8333'
    volumes:
      - seaweeddata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json

  # Grafana OpenTelemetry LGTM (Loki, Grafana, Tempo, Mimir)
  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - '3001:3000' # Grafana Web UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pgdata:
  seaweeddata:
