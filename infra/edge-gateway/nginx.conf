events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  # Host machine running Vite dev server (npm run dev on port 5173)
  upstream ui_dev_server {
    server host.docker.internal:5173;
  }

  upstream api_gateway {
    server api-gateway:3000;
  }

  upstream grafana_server {
    server otel-lgtm:3000;
  }

  server {
    listen 80;
    server_name libre.localhost;

    # Static / UI Route -> Host Vite Dev Server (supports Vite HMR & DevTools)
    location / {
      proxy_pass http://ui_dev_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Route -> API Gateway
    location /api/ {
      # EPUB uploads (up to 50 MB) and whole-book indexing payloads exceed
      # nginx's 1 MB default; parsing a large upload can take a while.
      client_max_body_size 60m;
      proxy_read_timeout 180s;
      proxy_send_timeout 180s;
      proxy_pass http://api_gateway/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Monitoring Route -> Grafana (otel-lgtm)
    location /monitoring/ {
      proxy_pass http://grafana_server/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
